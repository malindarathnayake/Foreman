# Gitleaks config — Foreman. Extends the default ruleset; the allowlist below is
# the ONLY sanctioned place to suppress a finding.
#
# Allowlist policy (Foreman v0.5.0 unit 1e): entries are EXACT TOKENS from test
# fixtures only — never patterns broad enough to mask a real credential, never
# production values. Every entry MUST carry a provenance comment naming the
# fixture file and why the string is token-shaped. The repo was swept for
# token-shaped fixture strings on 2026-07-06 (gh/AWS/OpenAI/Slack/Google key
# shapes + PEM headers); the entries below were added when the P4 redaction
# test fixtures landed and generic-api-key flagged their deliberately fake,
# low-entropy planted values (~3.5 bits entropy, unit id embedded in the name).

[extend]
useDefault = true

[allowlist]
description = "exact test-fixture tokens only — see policy header"
regexes = [
  # tests/foremanEnv.test.ts — FIXTURE_KEY_VALUE for the .foremanenv ${ENV:NAME}
  # loader tests (unit 4c). Deterministic fake; asserted scrubbed-from-output.
  '''fixture_key_4c000001''',
  # tests/invokeWorkerLifecycle.test.ts — FIXTURE_KEY_VALUE for the S7 lifecycle
  # secret-block tests (unit 4g). Deterministic fake; used to prove the outbound gate.
  '''fixture_key_4g000001''',
  # tests/redaction.test.ts — PLANTED_KEYS env-var NAMES (unit 4b scrub round-trips).
  # generic-api-key misreads the adjacent quoted NAME as a value; these are names,
  # their planted values are fixture_value_4b0000xx.
  '''SCRUB_4B_LEDGER_KEY''',
  '''SCRUB_4B_JOURNAL_KEY''',
  '''SCRUB_4B_PROGRESS_KEY''',
  '''SCRUB_4B_MARKDOWN_KEY''',
  # tests/aiderWorker.test.ts — FIXTURE_KEY_VALUE for the aider-cli transport tests
  # (unit 2c). Obviously-fake, low-entropy, unit id embedded in the name.
  '''fixture_key_aider2c_00001''',
  # tests/aiderWorker.test.ts — planted secret for the outbound secret-gate tests.
  # sk- prefix is deliberate (must LOOK like a key to exercise the gate); the
  # sequential 0-9 digits make it self-evidently fake.
  '''sk-fixture-0123456789''',
  # tests/foremanEnv.test.ts — OPENROUTER_API_KEY fixture for the worker_kind axis
  # tests. Deterministic fake; never a live credential.
  '''fixture_key_hard001''',
  # tests/invokeCouncil.test.ts — planted secret for the council outbound
  # secret-gate test. sk_ prefix is deliberate (must LOOK like a key to exercise
  # the gate); sequential counter suffix makes it self-evidently fake.
  '''sk_council_secret_0001''',
  # tests/invokeCouncil.test.ts — FOREMAN_API_KEY fixture for the council
  # payload-ceiling test. Deterministic fake, counter-suffixed.
  '''council_ceiling_key01''',
  # tests/councilConfig.test.ts — COUNCIL_TEST_KEY fixture for the seat-config
  # resolution tests (repo vs home store). Deterministic fake, counter-suffixed.
  '''council_test_key_00001''',
]
paths = [
  # dojo experiment ledger snapshots: base_file_hashes entries are sha256 content
  # hashes of workspace files (64-char hex), which generic-api-key misreads as
  # credentials. These files are archival experiment records, never config.
  '''dojo/.+/ledger-snapshot/foreman-events\.jsonl''',
]
