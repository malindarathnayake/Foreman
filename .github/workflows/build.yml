name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # SHA-pinned: this workflow holds contents:write + packages:write and
      # publishes to the registry — mutable tags on a write-privileged
      # publish path are a supply-chain hole [CWE-829]. Dependabot's
      # github-actions ecosystem update keeps these pins fresh.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: foreman-mcp/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@malindarathnayake'

      - name: Install dependencies
        working-directory: foreman-mcp
        run: npm ci

      - name: Build
        working-directory: foreman-mcp
        run: npm run build

      - name: Run tests
        working-directory: foreman-mcp
        run: npm test

      - name: Package
        working-directory: foreman-mcp
        run: |
          # Pack into a fresh CI-only directory (release-pkg/), NOT the
          # committed artifacts/ archive. This guarantees the Release step
          # ships ONLY the current version's tarball — historical tarballs
          # live in artifacts/ for archival reference, not for redistribution.
          mkdir -p ../release-pkg
          npm pack --pack-destination ../release-pkg/

      - name: Upload CI artifact (30-day retention)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: foreman-mcp-${{ github.sha }}
          path: release-pkg/*.tgz
          retention-days: 30

      # Same gate as ci.yml's publish-smoke job — duplicated deliberately: this
      # workflow fires on tags and must not assume push/PR CI ran on the exact
      # ref being published. Gate the publish itself.
      - name: Publish smoke gate
        working-directory: foreman-mcp
        run: node scripts/publish-smoke.mjs

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: foreman-mcp
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release-pkg/*.tgz
          generate_release_notes: true
          draft: false
